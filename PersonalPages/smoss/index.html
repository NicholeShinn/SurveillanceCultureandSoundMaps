/* Layout: one-screen app. A harbor chart fills the screen, a location index runs down the left (below on phones),

:root {

  --viewer-bg: #0E1518;
  --viewer-fg: #E8EEF0;
  --viewer-muted: #9AAAB0;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;

    --water: #0D161A; --water-line: #18262D; --park: #22352B; --fg: #E3EAEC; --muted: #93A3A9; --rule: #26343A;
    --mark: #E866B2; --mark-ring: #12191C; --card: #1B2428;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191C; --panel: #151D21; --land: #212B30; --land-2: #1A2326; --land-edge: #3D4F55;
  --water: #0D161A; --water-line: #18262D; --park: #22352B; --fg: #E3EAEC; --muted: #93A3A9; --rule: #26343A;
  --mark: #E866B2; --mark-ring: #12191C; --card: #1B2428;

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.head { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap;
  padding: 12px 20px; border-bottom: 1px solid var(--rule); background: var(--panel); }
.head h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 13.5px; }
.sample { display: inline-block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--mark); border: 1px solid currentColor; border-radius: 3px; padding: 1px 6px; margin-right: 8px; vertical-align: 1px; }

.index { background: var(--panel); border-right: 1px solid var(--rule); overflow-y: auto; min-height: 0; padding-block: 8px 16px; }
.index h2 { margin: 8px 20px 6px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.index ol { list-style: none; margin: 0; padding: 0; }
.loc { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 10px; align-items: start; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--rule); padding: 12px 20px; cursor: pointer; }

.loc .num { grid-row: span 3; width: 24px; height: 24px; border-radius: 50%; background: var(--mark); color: #fff; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 12px; font-weight: 500; margin-top: 1px; }
.loc .name { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.15; }
.loc .boro { color: var(--muted); font-size: 13px; }
.loc .ll { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.chart { position: relative; overflow: hidden; background: var(--water); touch-action: none; cursor: grab; min-height: 0; }
.chart.is-dragging { cursor: grabbing; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.land-nyc { fill: var(--land); stroke: var(--land-edge); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.park { fill: var(--park); stroke: none; }
.lbl-park { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 13px; letter-spacing: .08em; color: color-mix(in srgb, var(--fg) 55%, var(--park)); }
.land-other { fill: var(--land-2); stroke: var(--land-edge); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.grat { stroke: var(--water-line); stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; }
.grat-land { stroke: var(--land-edge); stroke-opacity: .25; stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; stroke-dasharray: 3 4; }
.contour { stroke: var(--water-line); stroke-width: 1.2; vector-effect: non-scaling-stroke; fill: none; }

.layer { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; user-select: none; }
.lbl-boro { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.lbl-other { font-family: var(--font-display); font-weight: 500; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); opacity: .75; }
.lbl-water { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 13px; letter-spacing: .06em; color: color-mix(in srgb, var(--fg) 45%, var(--water)); }
.edge-tick { position: absolute; font-family: var(--font-mono); font-size: 10px; color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }

.pin { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 0; padding: 0; background: none; cursor: pointer; pointer-events: auto; }
.pin span { position: absolute; inset: 3px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2.5px var(--mark-ring), 0 2px 6px rgba(0,0,0,.3);
  display: grid; place-items: center; color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 500; transition: transform .15s ease; }
.pin::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--mark); opacity: 0; transform: scale(.7); transition: opacity .2s, transform .2s; }
.pin:hover span, .pin.is-hot span { transform: scale(1.15); }
.pin:hover::before, .pin.is-hot::before { opacity: .7; transform: scale(1); }

.tools { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); background: var(--card); }
.tools button { width: 38px; height: 38px; border: 0; background: var(--card); cursor: pointer; font-size: 20px; line-height: 1; display: grid; place-items: center; }
.tools button + button { border-top: 1px solid var(--rule); }
.tools button:hover { background: color-mix(in srgb, var(--mark) 10%, var(--card)); }
.tools svg { width: 16px; height: 16px; position: static; }
.readout { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  font-family: var(--font-mono); font-size: 11px; color: var(--fg); font-variant-numeric: tabular-nums; }
.scalebar { display: flex; flex-direction: column; gap: 3px; }
.scalebar .bar { height: 6px; border: 1.5px solid var(--fg); border-top: 0; }
.cursor { color: var(--muted); min-height: 1.3em; }

.card { position: absolute; z-index: 5; width: 240px; max-width: calc(100% - 24px); background: var(--card); border-radius: 8px; box-shadow: var(--shadow);
  overflow: hidden; pointer-events: auto; opacity: 0; transform: translateY(4px); transition: opacity .14s ease, transform .14s ease; }
.card.is-on { opacity: 1; transform: none; }
.card img { display: block; width: 100%; aspect-ratio: 8 / 5; object-fit: cover; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.card p { margin: 0; white-space: pre-line; font-size: 13.5px; color: var(--muted); }
.card .go { margin-top: 6px; align-self: flex-start; border: 0; background: var(--mark); color: #fff; border-radius: 4px; padding: 6px 10px; font-weight: 600; font-size: 13px; cursor: pointer; }
.card .hint { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--muted); margin-top: 4px; }

/* Full-screen viewer: deliberately always dark, like a darkened gallery. */
.viewer { position: fixed; inset: 0; z-index: 20; background: var(--viewer-bg); color: var(--viewer-fg); display: grid;
  grid-template-columns: minmax(0, 1fr) 340px; opacity: 0; transition: opacity .25s ease; color-scheme: dark; }
.viewer.is-on { opacity: 1; }

.player .track span { font-family: var(--font-mono); font-size: 11px; color: var(--viewer-muted); }
.player label { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--viewer-muted); }
.player input[type=range] { flex: 1; accent-color: #E866B2; min-width: 0; }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-left: 6px; vertical-align: -1px; }
.eq i { width: 3px; background: #E866B2; height: 4px; }
.is-playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
.is-playing .eq i:nth-child(2) { animation-delay: -.3s; } .is-playing .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }
.vnav { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.vbtn { border: 1px solid #2E3D48; background: transparent; color: var(--viewer-fg); border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; }

  card.hidden = false; placeCard(i);
  requestAnimationFrame(() => card.classList.add("is-on"));
}
function placeCard(i) {
  const [sx, sy] = toScreen(pins[i].x, pins[i].y);
  const cw = card.offsetWidth, ch = card.offsetHeight, m = 12;
  let left = Math.min(Math.max(sx - cw / 2, m), view.W - cw - m);
  let top = sy - ch - 22;
  if (top < m) top = sy + 22;
  if (top + ch > view.H - m) top = Math.max(m, view.H - ch - m);
  card.style.left = left + "px"; card.style.top = top + "px";
}
function hideCard(delay = 0) {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { card.classList.remove("is-on"); card.hidden = true; hot = null; setHot(-1); }, delay);
}
card.addEventListener("pointerenter", () => clearTimeout(hideTimer));
card.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideCard(160); });

pins.forEach((p, i) => {
  p.b.addEventListener("pointerdown", e => { lastPointer = e.pointerType; });
  p.b.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") { lastPointer = "mouse"; showCard(i); } });
  p.b.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideCard(160); });
  p.b.addEventListener("focus", () => showCard(i));
  p.b.addEventListener("blur", () => hideCard(160));
  p.b.addEventListener("click", () => {
    // Touch: first tap previews, second tap opens. Mouse and keyboard open right away.
    if (lastPointer === "touch" || lastPointer === "pen") {
      if (hot === i && !card.hidden) openViewer(i, true); else showCard(i);
    } else openViewer(i, true);
    lastPointer = "mouse";
  });
  p.row.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") { lastPointer = "mouse"; showCard(i); } });
  p.row.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideCard(160); });
  p.row.addEventListener("click", () => openViewer(i, true));
});

/* ============================================================
   MUSIC — plays the file in properties.audio when set,
   otherwise a generated placeholder track (Web Audio).
   ============================================================ */
const MODES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10] };
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
const Music = {
  ctx: null, out: null, bus: null, timer: null, el: null, playing: false, current: null, vol: .7,
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.out = this.ctx.createGain(); this.out.gain.value = this.vol; this.out.connect(this.ctx.destination);
    // Simple echo for space
    const d = this.ctx.createDelay(1), fb = this.ctx.createGain(), wet = this.ctx.createGain();
    d.delayTime.value = .33; fb.gain.value = .32; wet.gain.value = .25;
    d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(this.out);
    this.send = d;
  },
  play(props) {
    this.stop(true);
    this.current = props;
    if (props.audio) {
      this.el = new Audio(props.audio); this.el.loop = true; this.el.volume = 0;
      this.el.play().then(() => this.fadeEl(this.vol, 1200)).catch(() => { this.playing = false; syncPlayer(); });
      this.playing = true; syncPlayer(); return;
    }
    this.ensure(); this.ctx.resume();
    const c = this.ctx, bus = c.createGain();
    bus.gain.setValueAtTime(0, c.currentTime); bus.gain.linearRampToValueAtTime(1, c.currentTime + 1.2);
    bus.connect(this.out); bus.connect(this.send);
    this.bus = bus;
    const m = props.music, scale = MODES[m.mode], R = rng(props.id + "♪");
    const pattern = Array.from({ length: 16 }, (_, k) => (k % 2 === 0 || R() < .35) ? Math.floor(R() * 5) : null);
    const step16 = 60 / m.bpm / 4;
    let step = 0, t = c.currentTime + .08;
    const note = (deg, oct) => { const n = scale.length; const o = Math.floor(deg / n); return m.root + 12 * (oct + o) + scale[((deg % n) + n) % n]; };
    const voice = (freq, start, dur, type, gain, cutoff) => {
      const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
      o.type = type; o.frequency.value = freq; f.type = "lowpass"; f.frequency.value = cutoff;
      g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(gain, start + Math.min(.03, dur * .2));
      g.gain.exponentialRampToValueAtTime(.0001, start + dur);
      o.connect(f); f.connect(g); g.connect(bus); o.start(start); o.stop(start + dur + .05);
    };
    const tick = () => {
      while (t < c.currentTime + .15) {
        const bar = Math.floor(step / 16), chordDeg = m.prog[bar % m.prog.length], s = step % 16;
        if (s === 0) {
          const dur = step16 * 16 + .4;
          [0, 2, 4].forEach((k, j) => { voice(midiHz(note(chordDeg + k, -1)), t, dur, "triangle", .05, 900); voice(midiHz(note(chordDeg + k, -1)) * 1.004, t, dur, "sine", .035, 1200); });
          voice(midiHz(note(chordDeg, -2)), t, step16 * 8, "sine", .12, 400);
        }
        if (s === 8) voice(midiHz(note(chordDeg, -2)), t, step16 * 8, "sine", .09, 400);
        const p = pattern[s];
        if (p !== null && !(bar % 4 === 3 && s > 11)) voice(midiHz(note(chordDeg + [0, 2, 4, 7, 9][p], 0)), t, step16 * 2.6, "triangle", .07, 2600);
        step++; t += step16;
      }
    };
    tick(); this.timer = setInterval(tick, 40);
    this.playing = true; syncPlayer();
  },
  fadeEl(target, ms) {
    const el = this.el; if (!el) return;
    const from = el.volume, t0 = performance.now();
    const f = now => { const k = Math.min(1, (now - t0) / ms); el.volume = from + (target - from) * k; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  },
  stop(immediate) {
    clearInterval(this.timer); this.timer = null;
    if (this.bus) {
      const b = this.bus, c = this.ctx; this.bus = null;
      b.gain.cancelScheduledValues(c.currentTime); b.gain.setValueAtTime(b.gain.value, c.currentTime);
      b.gain.linearRampToValueAtTime(0, c.currentTime + (immediate ? .15 : .45));
      setTimeout(() => b.disconnect(), 700);
    }
    if (this.el) { const el = this.el; this.el = null; el.pause(); }
    this.playing = false; syncPlayer();
  },
  toggle() { if (this.playing) this.stop(); else if (this.current) this.play(this.current); },
  setVol(v) { this.vol = v; if (this.out) this.out.gain.setTargetAtTime(v, this.ctx.currentTime, .05); if (this.el) this.el.volume = v; }
};
const ICON_PLAY = '<svg viewBox="0 0 18 18" fill="currentColor"><path d="M4 2.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 18 18" fill="currentColor"><path d="M4 2.5h3.5v13H4zM10.5 2.5H14v13h-3.5z"/></svg>';
function syncPlayer() {
  $("v-play").innerHTML = Music.playing ? ICON_PAUSE : ICON_PLAY;
  $("v-play").setAttribute("aria-label", Music.playing ? "Pause music" : "Play music");
  $("player").classList.toggle("is-playing", Music.playing);
}
$("v-play").onclick = () => Music.toggle();
$("v-vol").oninput = e => Music.setVol(e.target.value / 100);

/* ============================================================
   FULL VIEWER — deep-linkable by #id; Back closes it.
   ============================================================ */
const viewer = $("viewer");
let openIdx = null, pushed = false, lastFocus = null;
function drawFull() {
  if (openIdx === null) return;
  const p = feats[openIdx].properties, box = $("v-photo");
  box.querySelectorAll("canvas, img").forEach(n => n.remove());
  if (p.photo) {
    const img = new Image(); img.src = p.photo; img.alt = `Photo of ${p.title}`; box.prepend(img); return;
  }
  const r = box.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const c = document.createElement("canvas");
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  c.setAttribute("role", "img"); c.setAttribute("aria-label", `Placeholder photo of ${p.title}`);
  drawScene(c, p, c.width, c.height); box.prepend(c);
}
function openViewer(i, withSound) {
  const p = feats[i].properties;
  const was = openIdx;
  openIdx = i; hideCard();
  if (was === null) lastFocus = document.activeElement;
  $("v-kicker").textContent = `${String(i + 1).padStart(2, "0")} / ${String(feats.length).padStart(2, "0")} · ${p.borough}`;
  $("v-title").textContent = p.title;
  $("v-ll").textContent = fmtLL(feats[i].geometry.coordinates);
  $("v-desc").textContent = p.description;
  $("v-track").textContent = p.audio ? p.title : p.music.name;
  $("v-track-meta").textContent = p.audio ? "Audio file" : `Placeholder track · ${p.music.bpm} BPM`;
  viewer.hidden = false;
  requestAnimationFrame(() => { viewer.classList.add("is-on"); drawFull(); });
  if (withSound) Music.play(p); else { Music.stop(true); Music.current = p; }
  if (location.hash.slice(1) !== p.id) {
    if (was === null) { history.pushState(null, "", "#" + p.id); pushed = true; }
    else history.replaceState(null, "", "#" + p.id);
  }
  $("v-close").focus();
}
function closeViewer(fromHistory) {
  if (openIdx === null) return;
  Music.stop();
  openIdx = null;
  viewer.classList.remove("is-on");
  setTimeout(() => { if (openIdx === null) viewer.hidden = true; }, 250);
  if (!fromHistory) {
    if (pushed) { pushed = false; history.back(); }
    else history.replaceState(null, "", location.pathname + location.search);
  }
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
$("v-close").onclick = () => closeViewer(false);
$("v-prev").onclick = () => openViewer((openIdx - 1 + feats.length) % feats.length, Music.playing);
$("v-next").onclick = () => openViewer((openIdx + 1) % feats.length, Music.playing);
window.addEventListener("popstate", () => {
  const id = location.hash.slice(1), i = feats.findIndex(f => f.properties.id === id);
  if (i < 0) { pushed = false; closeViewer(true); } else if (i !== openIdx) openViewer(i, false);
});
document.addEventListener("keydown", e => {
  if (openIdx === null) return;
  if (e.key === "Escape") closeViewer(false);
  else if (e.key === "ArrowRight") $("v-next").click();
  else if (e.key === "ArrowLeft") $("v-prev").click();
  else if (e.key === "Tab") {
    const f = [...viewer.querySelectorAll("button, input")]; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(drawFull, 120); });

// Deep link on load: open the viewer; music waits for a tap (browsers require one).
(function boot() {
  const i = feats.findIndex(f => f.properties.id === location.hash.slice(1));
  syncPlayer();
  if (i >= 0) openViewer(i, false);
  feats.forEach(f => makeThumb(f.properties));
})();
</script>
