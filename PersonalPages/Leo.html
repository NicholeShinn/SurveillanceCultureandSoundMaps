<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Sound Map</title>
      <link rel="stylesheet" href="Leo.css">
  </head>
  <body>

<div class="sound-map">
      <img src="./PersonalPagesImages/LeoImages/sunrise.png" class="map-background" alt="Sound map">

      <!-- Pins generated from locations.js -->

      <!-- Popup -->
      <div id="map-popup" class="map-popup" hidden>
          <button class="close-button"
                  id="close-popup"
                  aria-label="Close popup">×</button>
          <h3 id="popup-title"></h3>
          <p id="popup-description"></p>
          <!-- Images generated by script.js -->
          <div id="popup-images" class="popup-images"></div>

          <audio id="popup-audio" controls></audio>
      </div>
  </div>
  </body>



  <script>
      // ----------------------------------
      // Location data
      // ----------------------------------

      const locations = [
          {
              title: "Spider Trail",
              description: "Spider trail has lots of spiders! Big mamas with little babies sharing delicate webs. We watch one play with her prey. Beautiful terrifying creatures. I see deer tails flash in the wood ahead. my footsteps scare them away. I tell them good morning. this trail ends where the Atlanta public safety center begins. you used to be able to get lost in these woods for hours.",
              audio: "./PersonalPagesSounds/LeoSounds/spiderTrail.mp3",
              left: "64%",
              top: "60%",
              images: [
                  "./PersonalPagesImages/LeoImages/spiderTrail1.jpg",
                  "./PersonalPagesImages/LeoImages/spiderTrail2.jpg",
                  "./PersonalPagesImages/LeoImages/spiderTrail3.jpg",
                  "./PersonalPagesImages/LeoImages/spiderTrail4.jpg"
              ]
          },
          {
              title: "Old Parking Lot",
              description: "We sit on cracked concrete slabs with traces of so much aliveness. a community that used to be here. im thinking about myths and legends, the idea of heroes. I imagine having kids and telling them the story of the city in the forest, and the defenders of the trees who risked everything to protect it. I would tell them of a hero named Tortuguita, whose spirit now protects and watches over the land. I wonder what it means to mythologize victims of state violence. I wonder what it means to tell their stories. I  wonder how long until something becomes history? What history even means when fact and narratives are warped?  And I am here right now. This place is not just a story. There are ants crawling onto my hands and a hawk circles us overhead. The weeds grow between the cracked concrete. And the sun is shining.",
              audio: "./PersonalPagesSounds/LeoSounds/oldParkingLot.mp3",
              left: "67%",
              top: "64%",
              images: [
                  "./PersonalPagesImages/LeoImages/oldParkingLot1.jpg",
                  "./PersonalPagesImages/LeoImages/oldParkingLot2.jpg",
                  "./PersonalPagesImages/LeoImages/oldParkingLot3.jpg",
                  "./PersonalPagesImages/LeoImages/oldParkingLot4.jpg"
              ]
          },
          {
              title: "Field",
              description: "The field is really quiet in the morning. I only hear a few birds. I see airplanes. I hear cars passing on the road nearby. I hear the wind in the trees. I love the way the tall grasses crunch below my feet. My shoes and pants are covered in morning dew kisses. I feel sort of in wilderness but aware of the structures and systems that surround this place. I like being quiet here. ",
              audio: "./PersonalPagesSounds/LeoSounds/field.mp3",
              left: "57%",
              top: "65%",
              images: [
                  "./PersonalPagesImages/LeoImages/field1.jpg",
                  "./PersonalPagesImages/LeoImages/field2.jpg",
                  "./PersonalPagesImages/LeoImages/field3.jpg",
                  "./PersonalPagesImages/LeoImages/field4.jpg"
              ]
          },
          {
              title: "River",
              description: "Rolling around in the grass singing old cute silly songs we both know listening to the water. we come across tents of a forest defender camp. we find a first aid kit, peanuts, ziploc bags. there’s moss growing over the tents now. there’s bugs burrowing and decomposing beneath them. what was the last night people slept here? what did they dream about? ",
              audio: "./PersonalPagesSounds/LeoSounds/river.mp3",
              left: "49%",
              top: "63%",
              images: [
                  "./PersonalPagesImages/LeoImages/river1.jpg",
                  "./PersonalPagesImages/LeoImages/river2.jpg",
                  "./PersonalPagesImages/LeoImages/river3.jpg",
                  "./PersonalPagesImages/LeoImages/river4.jpg"
              ]
          }
      ];

      // ----------------------------------
      // Map elements
      // ----------------------------------

      const map = document.querySelector(".sound-map");
      const popup = document.getElementById("map-popup");
      const audio = document.getElementById("popup-audio");
      const imageGrid = document.getElementById("popup-images");

      // Generate map pins
      locations.forEach((location, index) => {
          const pin = document.createElement("button");

          pin.className = "map-pin";
          pin.textContent = index + 1;
          pin.setAttribute("aria-label", location.title);

          pin.style.left = location.left;
          pin.style.top = location.top;

          pin.addEventListener("click", () => showPopup(index));

          map.insertBefore(pin, popup);
      });

      // ----------------------------------
      // Popup
      // ----------------------------------

      function showPopup(index) {
          const location = locations[index];

          document.getElementById("popup-title").textContent =
              location.title;

          document.getElementById("popup-description").textContent =
              location.description;

          // Build 2x2 image grid
          imageGrid.replaceChildren();

          location.images.forEach((path, i) => {
              const img = document.createElement("img");
              img.src = path;
              img.alt = `${location.title} photo ${i + 1}`;
              imageGrid.appendChild(img);
          });

          // Load sound
          audio.pause();
          audio.src = location.audio;
          audio.load();

          popup.hidden = false;
      }

      function closePopup() {
          audio.pause();
          popup.hidden = true;
      }

      // Close button
      popup.querySelector(".close-button")
          .addEventListener("click", closePopup);

      // Escape key
      document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closePopup();
      });
  </script>

</html>
